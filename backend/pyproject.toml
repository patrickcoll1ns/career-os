[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careeros-api"
version = "0.1.0"
description = "FastAPI backend for the CareerOS career copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "anthropic>=0.70,<1.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3.0",
  "pytest>=8.4,<10.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["."]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["I001"]
